<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Tindak Lanjut - Ngingetken</title><link rel="stylesheet" href="assets/css/style.css"/><script src="assets/js/auth.js"></script><script>requireAdminAccess();</script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div><div class="brand-title">Ngingetken</div><div class="brand-subtitle">Tindak Lanjut</div></div></div><nav class="nav"><a href="dashboard.html">📊 Dashboard</a><a class="active" href="tindak-lanjut.html">✅ Tindak Lanjut</a><a href="riwayat.html">🧾 Riwayat</a></nav></aside><main class="main"><div class="topbar"><div><div class="eyebrow">Follow-up Board</div><h1>Catatan Tindak Lanjut</h1><p class="lead">Kelola pegawai yang belum mengisi, terlambat, atau perlu pendampingan.</p></div><button class="btn btn-primary" onclick="openModal()">Tambah Manual</button></div><section class="kanban"><div class="kanban-col"><h3>Open</h3><div id="openCol"></div></div><div class="kanban-col"><h3>Proses</h3><div id="processCol"></div></div><div class="kanban-col"><h3>Closed</h3><div id="closedCol"></div></div></section></main></div><div class="modal-backdrop" id="modal"><div class="modal"><h2>Tambah Tindak Lanjut</h2><div class="grid grid-2"><input id="nama" class="input" placeholder="Nama pegawai"><input id="pegawai_id" class="input" placeholder="ID Pegawai"><select id="prioritas"><option>Low</option><option selected>Medium</option><option>High</option></select><select id="status"><option>Open</option><option>Proses</option><option>Closed</option></select></div><textarea id="catatan" class="input" rows="4" placeholder="Catatan tindak lanjut"></textarea><div class="toolbar"><button class="btn btn-secondary" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveFollowup()">Simpan</button></div></div></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>let rows=[];function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}async function init(){rows=await requestApi('getFollowUps');render()}function item(f){return`<div class="kanban-item"><b>${f.nama||'-'}</b><br><span class="badge ${badgeStatus(f.prioritas)}">${f.prioritas||'-'}</span><p>${f.catatan||''}</p><small>${f.created_at||''}</small><div class="toolbar"><button class="btn btn-secondary" onclick="mark('${f.followup_id}','Proses')">Proses</button><button class="btn btn-secondary" onclick="mark('${f.followup_id}','Closed')">Closed</button></div></div>`}function render(){openCol.innerHTML=rows.filter(r=>String(r.status).toLowerCase()==='open').map(item).join('')||'<div class="empty-state">Kosong</div>';processCol.innerHTML=rows.filter(r=>String(r.status).toLowerCase()==='proses').map(item).join('')||'<div class="empty-state">Kosong</div>';closedCol.innerHTML=rows.filter(r=>String(r.status).toLowerCase()==='closed').map(item).join('')||'<div class="empty-state">Kosong</div>'}async function saveFollowup(){await requestApi('createFollowUp',{followup:{nama:nama.value,pegawai_id:pegawai_id.value,prioritas:prioritas.value,status:status.value,catatan:catatan.value}});closeModal();showToast('Tindak lanjut disimpan');init()}async function mark(id,status){await requestApi('updateFollowUp',{followup_id:id,status});showToast('Status diperbarui');init()}init().catch(e=>showToast(e.message));</script></body></html>
