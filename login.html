<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Admin - Ngingetken</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="hero">
    <section class="card hero-card" style="max-width:520px;margin:0 auto;text-align:left">
      <div class="eyebrow">Akses Admin</div>
      <h1>Login Admin</h1>
      <p class="lead">Masukkan password untuk membuka dashboard Ngingetken.</p>
      <form id="loginForm" style="margin-top:22px">
        <label class="form-field">Password
          <input class="input" type="password" name="password" autocomplete="current-password" required autofocus placeholder="Password admin" />
        </label>
        <div id="loginError" class="alert danger" style="display:none;margin-top:14px"></div>
        <div class="toolbar" style="margin-top:18px">
          <button class="btn btn-primary" type="submit">Masuk Admin</button>
          <a class="btn btn-secondary" href="index.html">Kembali</a>
        </div>
      </form>
    </section>
  </main>
  <script src="assets/js/auth.js"></script>
  <script>
    const errorBox = document.getElementById('loginError');
    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      handleAdminLogin(event.target);
      if (errorBox && errorBox.textContent) errorBox.style.display = 'block';
    });
  </script>
</body>
</html>
