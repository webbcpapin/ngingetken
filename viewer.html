<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Viewer Pimpinan - Ngingetken</title><link rel="stylesheet" href="assets/css/style.css"/><script src="assets/js/auth.js"></script><script>requireAdminAccess();</script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><img src="assets/img/logo-ngingetken.png" alt="Logo Ngingetken"></div><div><div class="brand-title">Ngingetken</div><div class="brand-subtitle">Mode Pimpinan</div></div></div><nav class="nav"><a href="dashboard.html">📊 Dashboard</a><a class="active" href="viewer.html">👔 Viewer Pimpinan</a><a href="laporan.html">📄 Laporan</a></nav></aside><main class="main"><div class="topbar"><div><div class="eyebrow">Executive View</div><h1>Ringkasan Kepatuhan Integritas</h1><p id="periodInfo" class="lead"></p></div><button class="btn btn-primary" onclick="window.print()">Print Ringkasan</button></div><section class="grid grid-4"><div class="card stat-card"><div class="stat-label">Total</div><div id="total" class="stat-value">0</div></div><div class="card stat-card"><div class="stat-label">Sudah</div><div id="submitted" class="stat-value">0</div></div><div class="card stat-card"><div class="stat-label">Belum</div><div id="pending" class="stat-value">0</div></div><div class="card stat-card"><div class="stat-label">Kepatuhan</div><div id="percentage" class="stat-value">0%</div></div></section><section class="grid grid-2" style="margin-top:16px"><div class="card"><h3>Status per Unit</h3><div class="table-wrap"><table><thead><tr><th>Unit</th><th>Total</th><th>Sudah</th><th>Belum</th><th>Persen</th></tr></thead><tbody id="unitBody"></tbody></table></div></div><div class="card"><h3>Rekomendasi Tindak Lanjut</h3><div id="recommendation"></div></div></section></main></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>async function init(){const d=await requestApi('getExecutiveSummary');const p=d.activePeriod||{};periodInfo.textContent=`${p.nama_periode||'-'} • Deadline ${formatDate(p.tanggal_deadline)}`;total.textContent=d.summary.total;submitted.textContent=d.summary.submitted;pending.textContent=d.summary.pending;percentage.textContent=d.summary.percentage+'%';unitBody.innerHTML=(d.byUnit||[]).map(r=>`<tr><td>${r.unit}</td><td>${r.total}</td><td>${r.submitted}</td><td>${r.pending}</td><td>${r.total?Math.round(r.submitted/r.total*100):0}%</td></tr>`).join('');const pct=d.summary.percentage;recommendation.innerHTML=pct>=95?'<div class="alert">Kepatuhan sangat baik. Pertahankan pola reminder rutin dan arsipkan laporan periode.</div>':pct>=80?'<div class="alert warning">Kepatuhan baik namun masih ada pegawai yang perlu reminder personal.</div>':'<div class="alert danger">Perlu eskalasi monitoring. Prioritaskan unit dengan kepatuhan rendah dan buat tindak lanjut.</div>'}init().catch(e=>showToast(e.message));</script></body></html>
