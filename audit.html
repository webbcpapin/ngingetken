<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Audit Log - Ngingetken</title><link rel="stylesheet" href="assets/css/style.css"/><script src="assets/js/auth.js"></script><script>requireAdminAccess();</script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><img src="assets/img/logo-ngingetken.png" alt="Logo Ngingetken"></div><div><div class="brand-title">Ngingetken</div><div class="brand-subtitle">Audit Log</div></div></div><nav class="nav"><a href="dashboard.html">📊 Dashboard</a><a class="active" href="audit.html">🔐 Audit Log</a></nav></aside><main class="main"><div class="topbar"><div><div class="eyebrow">System Log</div><h1>Audit Aktivitas</h1><p class="lead">Memantau aktivitas setup, input, perubahan periode, dan tindak lanjut.</p></div></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>User</th><th>Aktivitas</th><th>Detail</th></tr></thead><tbody id="body"><tr><td colspan="4" class="empty">Memuat...</td></tr></tbody></table></div></section></main></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>async function init(){const rows=await requestApi('getAuditLogs');body.innerHTML=rows.length?rows.map(r=>`<tr><td>${r.waktu||'-'}</td><td>${r.user||'-'}</td><td>${r.aktivitas||'-'}</td><td>${r.detail||'-'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada log.</td></tr>'}init().catch(e=>{body.innerHTML='<tr><td colspan="4" class="empty">Audit log tersedia setelah Apps Script v4 dipasang.</td></tr>';showToast(e.message)});</script></body></html>
