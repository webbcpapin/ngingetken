<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngingetken - Bea Cukai Pangkalpinang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 10;
            overflow: visible;
        }
        .logo-section {
            margin-bottom: 25px;
        }
        .logo-img {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }
        .logo-text {
            font-size: 1rem;
            color: #1a237e;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .emoji { font-size: 3rem; margin-bottom: 15px; }
        .question {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 40px;
            line-height: 1.5;
            font-weight: 600;
        }
        .buttons {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 60px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 140px;
            transition: transform 0.1s;
        }
        .btn-ya {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            z-index: 100;
        }
        .btn-ya:active { transform: scale(0.95); }
        .btn-tidak {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
            position: relative;
            z-index: 200;
            transition: all 0.05s ease-out;
            pointer-events: auto;
        }
        .hint {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="logo-section">
            <img src="https://oneweb-file.beacukai.go.id/cdn/download/mandatory/6459eac4cd0d5bae045aad25"
                 alt="Logo Bea Cukai" class="logo-img"
                 onerror="this.style.display='none'">
            <div class="logo-text">BEA CUKAI PANGKALPINANG</div>
        </div>
        <div class="emoji">🙏</div>
        <h1 class="question">Apakah anda sudah bersyukur dengan pekerjaan anda sekarang?</h1>
        <div class="buttons">
            <button class="btn btn-ya" onclick="window.location.href='akses.html'">YA</button>
            <button class="btn btn-tidak" id="btnTidak">TIDAK</button>
        </div>
        <p class="hint">Pilih dengan hati yang tulus... 😊</p>
    </div>

    <script>
        const btnTidak = document.getElementById('btnTidak');
        const container = document.getElementById('container');
        let isMoving = false;

        function getRandomPosition() {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnTidak.getBoundingClientRect();
            const padding = 15;
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;

            return {
                x: Math.random() * (maxX - padding) + padding,
                y: Math.random() * (maxY - padding) + padding
            };
        }

        function moveButton() {
            if (isMoving) return;
            isMoving = true;

            const pos = getRandomPosition();
            btnTidak.style.position = 'absolute';
            btnTidak.style.left = pos.x + 'px';
            btnTidak.style.top = pos.y + 'px';
            btnTidak.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg)`;

            setTimeout(() => { isMoving = false; }, 50);
        }

        btnTidak.addEventListener('mouseover', function(e) {
            e.preventDefault();
            moveButton();
        });

        btnTidak.addEventListener('mouseenter', function(e) {
            e.preventDefault();
            moveButton();
        });

        btnTidak.addEventListener('mousemove', function(e) {
            e.preventDefault();
            moveButton();
        });

        btnTidak.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveButton();
        }, {passive: false});

        btnTidak.addEventListener('touchmove', function(e) {
            e.preventDefault();
            moveButton();
        }, {passive: false});

        btnTidak.addEventListener('click', function(e) {
            e.preventDefault();
            moveButton();
        });

        btnTidak.addEventListener('mousedown', function(e) {
            e.preventDefault();
            moveButton();
        });

        document.addEventListener('mousemove', function(e) {
            const btnRect = btnTidak.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = Math.sqrt(
                Math.pow(e.clientX - btnCenterX, 2) +
                Math.pow(e.clientY - btnCenterY, 2)
            );

            if (distance < 80 && distance > 0) {
                moveButton();
            }
        });

        document.addEventListener('touchmove', function(e) {
            const touch = e.touches[0];
            const btnRect = btnTidak.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = Math.sqrt(
                Math.pow(touch.clientX - btnCenterX, 2) +
                Math.pow(touch.clientY - btnCenterY, 2)
            );

            if (distance < 80 && distance > 0) {
                moveButton();
            }
        }, {passive: false});
    </script>
</body>
</html>
