<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Riwayat Pegawai - Ngingetken</title><link rel="stylesheet" href="assets/css/style.css"/><script src="assets/js/auth.js"></script><script>requireAdminAccess();</script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div><div class="brand-title">Ngingetken</div><div class="brand-subtitle">Riwayat</div></div></div><nav class="nav"><a href="dashboard.html">📊 Dashboard</a><a href="pegawai.html">👥 Pegawai</a><a class="active" href="riwayat.html">🧾 Riwayat</a></nav></aside><main class="main"><div class="topbar"><div><div class="eyebrow">Employee History</div><h1 id="title">Riwayat Pegawai</h1><p class="lead">Melihat histori pengisian dan tindak lanjut per pegawai.</p></div><select id="employeeSelect" onchange="loadHistory()"></select></div><section class="grid grid-3"><div class="card"><h3>Profil</h3><div id="profile"></div></div><div class="card"><h3>Statistik</h3><div id="stats"></div></div><div class="card"><h3>Status Terakhir</h3><div id="lastStatus"></div></div></section><section class="card" style="margin-top:16px"><h3>Timeline</h3><div id="timeline" class="timeline"></div></section></main></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>let employees=[];async function init(){employees=await requestApi('getEmployees');employeeSelect.innerHTML=employees.map(e=>`<option value="${e.pegawai_id}">${e.nama} - ${e.unit}</option>`).join('');const p=new URLSearchParams(location.search).get('pegawai_id');if(p)employeeSelect.value=p;loadHistory()}async function loadHistory(){const pegawai_id=employeeSelect.value;const data=await requestApi('getEmployeeHistory',{pegawai_id});const emp=data.employee||employees.find(e=>e.pegawai_id===pegawai_id)||{};title.textContent='Riwayat '+(emp.nama||'Pegawai');profile.innerHTML=`<b>${emp.nama||'-'}</b><br>Unit: ${emp.unit||'-'}`;const responses=(data.responses||[]).filter(r=>!r.pegawai_id||r.pegawai_id===pegawai_id);stats.innerHTML=`<div class="stat-value">${responses.length}</div><div class="stat-note">Total pengisian tercatat</div>`;lastStatus.innerHTML=responses.length?`<span class="badge ${badgeStatus(responses.at(-1).risk_level)}">${responses.at(-1).risk_level||'-'}</span><p>Skor: ${responses.at(-1).integrity_score||'-'}</p>`:'<div class="empty-state">Belum ada respons</div>';timeline.innerHTML=[...responses.map(r=>`<div class="timeline-item"><b>Pengisian ${r.periode_id||''}</b><br>${r.waktu_submit||''}<br>Status: ${r.status_validasi||'-'} • Risiko: ${r.risk_level||'-'}</div>`),...(data.followups||[]).filter(f=>f.pegawai_id===pegawai_id).map(f=>`<div class="timeline-item"><b>Tindak Lanjut</b><br>${f.created_at||''}<br>${f.catatan||''}</div>`)].join('')||'<div class="empty-state">Belum ada riwayat.</div>'}init().catch(e=>showToast(e.message));</script></body></html>
